name: Release to PyPI

on:
  push:
    tags: ["*"]

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.repository == 'numbagg/numbagg'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Build package
        run: |
          git clean -xdf
          git restore -SW .
          uv build

      - name: Check artifacts
        run: |
          uv tool run --from twine twine check dist/*
          # The tag is the source of truth: `setuptools_scm` derives the version from
          # it, and falls back to `fallback_version` (see `pyproject.toml`) when the
          # tag isn't visible — e.g. a shallow fetch. Check for the tag's own sdist
          # rather than a sentinel filename, which the fallback never produces.
          expected="${GITHUB_REF_NAME#v}"
          if [ ! -f "dist/numbagg-${expected}.tar.gz" ]; then
            echo "❌ No dist/numbagg-${expected}.tar.gz built for tag '$GITHUB_REF_NAME'; got:"
            printf '  %s\n' dist/*
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  test-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: test-pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Test installation
        run: |
          version="${GITHUB_REF_NAME#v}"

          # Create a virtual environment
          uv venv

          # Install dependencies from trusted PyPI first
          uv pip install numpy numba

          # Install numbagg from TestPyPI without dependencies to ensure we get the
          # test package. Pin the exact version: unpinned, a TestPyPI index that
          # hasn't yet listed the upload resolves to the *previous* release, and the
          # gate goes green without the artifact we're about to publish ever being
          # installed. Pinned, a lagging index fails the install, so retry instead.
          installed=""
          for attempt in $(seq 1 10); do
            if uv pip install --index-url https://test.pypi.org/simple --no-deps "numbagg==${version}"; then
              installed=$(uv run python -c "import numbagg; print(numbagg.__version__)")
              break
            fi
            echo "numbagg==${version} not on TestPyPI yet (attempt ${attempt}/10); retrying in 15s"
            sleep 15
          done

          # Verify installation works
          if [ "$installed" != "$version" ]; then
            echo "❌ Expected numbagg ${version} from TestPyPI, got '${installed:-nothing}'"
            exit 1
          fi
          echo "Successfully installed numbagg ${installed} from TestPyPI"

  pypi:
    needs: test-pypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
