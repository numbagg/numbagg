# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    commit-message:
      prefix: "chore: "
    ignore:
      # The `max-sixty/tend/*` pins live in generated workflow files, and the
      # generator changes the workflow bodies alongside the action. Bumping the
      # pin on its own pairs new action code with old bodies, so tend-nightly's
      # regeneration PR is the only supported upgrade path.
      #
      # The name is the bare repo, not the `uses:` path: the workflows pin
      # `max-sixty/tend/claude@<version>`, but Dependabot names the dependency
      # `max-sixty/tend` (see the `updated-dependencies` trailer on #844).
      # Widening this to the subpath would silently stop matching.
      - dependency-name: "max-sixty/tend"
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore: "
