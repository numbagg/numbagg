bot_name: numbagg-bot
harness: codex
model: gpt-6-sol
# The agent runs everything through `uv run` (CLAUDE.md); setup-uv is where it
# gets uv. The agent now works in the job's own checkout and home, so `uv sync`
# runs here: it warms the `.venv` the agent's `uv run` reuses, leaving only what
# a PR itself changes to sync in-session. `uv sync` needs setup-uv ahead of it,
# since tend puts nothing on a `setup:` step's PATH.
setup:
- uses: astral-sh/setup-uv@v7
- run: uv sync
workflows:
  ci-fix:
    watched_workflows:
    - Test
