# https://pre-commit.com/
# Copied from xarray
ci:
  # These run `uv`, which pre-commit.ci's environment doesn't have; the `lint`
  # job in test.yaml runs them instead.
  skip: [ty, stubtest]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/Carreau/velin
    rev: 0.0.12
    hooks:
      - id: velin
        args: ["--write", "--compact"]
  - repo: https://github.com/adhtruong/mirrors-typos
    rev: v1.49.0
    hooks:
      - id: typos
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        exclude: dependabot.yml
  - repo: local
    hooks:
      - id: no-print
        name: no-print
        description: We shouldn't merge code with `print(` in
        language: pygrep
        types: ["python"]
        entry: 'print\('
        exclude: ".*/test/.*"
      - id: ty
        name: ty
        description: Type-check with ty
        language: system
        entry: uv run ty check
        types_or: ["python", "pyi"]
        pass_filenames: false
      - id: stubtest
        name: stubtest
        description: Check the `.pyi` stubs match the runtime modules
        language: system
        # TODO: replace CLI options with pyproject.toml config when stubtest supports it
        entry:
          uv run python -m mypy.stubtest numbagg.funcs numbagg.moving
          numbagg.moving_exp --allowlist stubtest_allowlist.txt
          --ignore-unused-allowlist --mypy-config-file pyproject.toml
        files: '^(numbagg/|stubtest_allowlist\.txt$|pyproject\.toml$)'
        pass_filenames: false
